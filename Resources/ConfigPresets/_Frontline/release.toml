# This changes some values for actual server/release sessions.

[game]
# IPIntel Information
ipintel_enabled = true
ipintel_contact_email = "ss14opal@gmail.com"

# Panic Bunker
panic_bunker.custom_reason = "You have not played on Frontline long enough to connect to this server right now since there are no admins online. You may join the Discord and check to see if anyone is able to let you in."
panic_bunker.min_overall_minutes = 300
panic_bunker.show_reason = true
panic_bunker.whitelisted_can_bypass = true
panic_bunker.count_deadminned_admins = false
panic_bunker.disable_with_admins = true
panic_bunker.enable_without_admins = true

